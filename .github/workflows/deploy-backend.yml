name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/cms/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Backend Deploy Webhook
        run: |
          curl --request GET '${{ secrets.COOLIFY_BACKEND_WEBHOOK }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}'
