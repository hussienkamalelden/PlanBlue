name: Trigger Coolify Redeploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Frontend Deploy Webhook
        run: |
          curl -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" "${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}"

      - name: Trigger Backend Deploy Webhook (Optional)
        run: |
          curl -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" "${{ secrets.COOLIFY_BACKEND_WEBHOOK }}"
