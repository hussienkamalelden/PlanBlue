name: Trigger Coolify Redeploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Frontend Deploy Webhook
        run: |
          curl --request POST '${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}'

      - name: Trigger Backend Deploy Webhook (Optional)
        run: |
          curl --request POST '${{ secrets.COOLIFY_BACKEND_WEBHOOK }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}'
