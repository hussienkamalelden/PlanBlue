name: Trigger Coolify Redeploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Frontend Deploy Webhook
        run: |
          curl --request GET '${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}'

      - name: Trigger Backend Deploy Webhook (Optional)
        run: |
          curl --request GET '${{ secrets.COOLIFY_BACKEND_WEBHOOK }}'
