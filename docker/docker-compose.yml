services:
  postgres:
    image: postgres:16-alpine
    container_name: planblue-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planblue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planblue_dev}
      POSTGRES_DB: ${POSTGRES_DB:-planblue}
    volumes:
      - planblue_pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planblue} -d ${POSTGRES_DB:-planblue}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  planblue_pg_data:
